version: '3.8'

services:
  logmyday-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logmyday-app
    ports:
      - "9099:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Non-sensitive configuration
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:9099
      # Host names the app answers to
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      # SQLite database file on the logmyday-data volume
      - DB_PATH=${DB_PATH:-/app/data/logmyday.db}
      # API base address
      - Api__BaseAddress=${API_BASE_URL:-http://localhost:9099}
      # Email SMTP configuration
      - Email__SmtpServer=${SMTP_SERVER:-smtp.example.com}
      - Email__SmtpPort=${SMTP_PORT:-587}
      - Email__UseSsl=${SMTP_USE_SSL:-true}
      - Email__UserName=${SMTP_USERNAME:-noreply@example.com}
      - Email__SenderEmail=${SMTP_SENDER_EMAIL:-noreply@example.com}
      - Email__SenderName=${SMTP_SENDER_NAME:-LogMyDay}
      - Email__PasswordResetUrl=${PASSWORD_RESET_URL:-http://localhost:9099/reset-password}
      # Rate limiting
      - Security__RateLimit__MaxAttemptsPerWindow=${RATE_LIMIT_MAX_ATTEMPTS:-5}
      - Security__RateLimit__WindowMinutes=${RATE_LIMIT_WINDOW_MINUTES:-15}
      - Security__RateLimit__LockoutMinutes=${RATE_LIMIT_LOCKOUT_MINUTES:-30}
      # AI assistant (optional)
      - AI__Enabled=${AI_ENABLED:-false}
      - AI__Provider=${AI_PROVIDER:-openai}
      - AI__Model=${AI_MODEL:-gpt-4o-mini}
      # The first admin's email, used only by the first start of a new installation
      - Admin__Email=${ADMIN_EMAIL:-}
    secrets:
      - smtp_password
      - ai_api_key
      - admin_password
    volumes:
      # Persistent database
      - logmyday-data:/app/data
      # Persistent logs
      - logmyday-logs:/app/Logs
    networks:
      - logmyday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

secrets:
  smtp_password:
    file: ./secrets/smtp_password.txt
  ai_api_key:
    file: ./secrets/ai_api_key.txt
  # The first admin's password, used only by the first start of a new installation
  admin_password:
    file: ./secrets/admin_password.txt

volumes:
  logmyday-data:
    driver: local
  logmyday-logs:
    driver: local

networks:
  logmyday-network:
    driver: bridge
